name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json, os
          raw = os.environ.get("STORAGE_CREDENTIALS", "").strip()
          if raw:
              try:
                  data = json.loads(raw)
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      if "aws_access_key_id" in data:
                          f.write(f"AWS_ACCESS_KEY_ID={data['aws_access_key_id']}\n")
                          f.write(f"AWS_SECRET_ACCESS_KEY={data['aws_secret_access_key']}\n")
                          f.write("AWS_DEFAULT_REGION=us-east-1\n")
                      elif "type" in data and data["type"] == "service_account":
                          with open("/tmp/sa-key.json", "w") as kf:
                              kf.write(raw)
                          f.write("GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json\n")
              except Exception as e:
                  print(f"Auth parse error: {e}")
          PYEOF

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage (with Rollback Safety Check - Bonus 4)
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os, json
          bucket = os.environ["ARTIFACT_BUCKET"]
          model_path = "models/model.joblib"
          report_path = "outputs/report.json"
          detail_path = "outputs/detail.txt"
          model_key = "artifacts/current/model.joblib"
          report_key = "artifacts/current/report.json"
          detail_key = "artifacts/current/detail.txt"

          with open(report_path) as f:
              new_report = json.load(f)
          f1_new = float(new_report.get("f1_score", 0.0))

          f1_old = None

          if "GOOGLE_APPLICATION_CREDENTIALS" in os.environ:
              from google.cloud import storage
              client = storage.Client()
              b = client.bucket(bucket)
              old_blob = b.blob(report_key)
              if old_blob.exists():
                  try:
                      old_data = json.loads(old_blob.download_as_text())
                      f1_old = float(old_data.get("f1_score", 0.0))
                  except Exception as e:
                      print(f"Khong the doc report cu: {e}")

              if f1_old is not None:
                  print(f"[Bonus 4] So sanh F1: Model moi ({f1_new:.4f}) vs Model cu ({f1_old:.4f})")
                  if f1_new < f1_old:
                      raise SystemExit(f"ROLLBACK TRIGGERED: Model moi F1 ({f1_new:.4f}) < Model cu ({f1_old:.4f}). Huy upload!")
              else:
                  print(f"[Bonus 4] Chua co model cu tren cloud storage. Chap nhan model moi voi F1 = {f1_new:.4f}")

              b.blob(model_key).upload_from_filename(model_path)
              b.blob(report_key).upload_from_filename(report_path)
              if os.path.exists(detail_path):
                  b.blob(detail_key).upload_from_filename(detail_path)
              print(f"Uploaded model & reports to gs://{bucket}/artifacts/current/")
          else:
              import boto3
              from botocore.exceptions import ClientError
              s3 = boto3.client("s3")
              try:
                  res = s3.get_object(Bucket=bucket, Key=report_key)
                  old_data = json.loads(res['Body'].read().decode('utf-8'))
                  f1_old = float(old_data.get("f1_score", 0.0))
              except ClientError as e:
                  if e.response['Error']['Code'] != 'NoSuchKey':
                      print(f"Loi doc report S3: {e}")
              except Exception as e:
                  print(f"Khong the doc report cu: {e}")

              if f1_old is not None:
                  print(f"[Bonus 4] So sanh F1: Model moi ({f1_new:.4f}) vs Model cu ({f1_old:.4f})")
                  if f1_new < f1_old:
                      raise SystemExit(f"ROLLBACK TRIGGERED: Model moi F1 ({f1_new:.4f}) < Model cu ({f1_old:.4f}). Huy upload!")
              else:
                  print(f"[Bonus 4] Chua co model cu tren S3. Chap nhan model moi voi F1 = {f1_new:.4f}")

              s3.upload_file(model_path, bucket, model_key)
              s3.upload_file(report_path, bucket, report_key)
              if os.path.exists(detail_path):
                  s3.upload_file(detail_path, bucket, detail_key)
              print(f"Uploaded model & reports to s3://{bucket}/artifacts/current/")
          PYEOF

      - name: Save report and detail artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1

